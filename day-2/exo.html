<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e0e0e0;
    }
    section {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
    }
    .animate-box {
      width: 100px;
      height: 100px;
      background: #3498db;
    }
  </style>
</head>
<body>
  <section style="background: #fefefe;">Scroll down</section>
  <section>
    <div class="animate-box"></div>
  </section>
  <section style="background: #ccc;">The End</section>

  <!-- GSAP Core + ScrollTrigger CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    gsap.from('.animate-box', {
      scrollTrigger: {
        trigger: '.animate-box',
        start: 'top 80%',
        end: 'bottom 20%',
        toggleActions: 'play none none reverse',
        markers: true,
        
    // Remove this line to hide scroll markers
      },
      x: -200,
      opacity: 0,
      duration: 1.5,
      ease: 'power2.out'
    });
  </script>
</body>
</html>
